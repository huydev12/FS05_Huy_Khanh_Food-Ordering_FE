server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not cache index.html to ensure clients always get the latest bundle hash
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache static assets that have hash in their filenames
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
