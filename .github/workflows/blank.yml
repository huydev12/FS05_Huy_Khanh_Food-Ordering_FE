name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY}}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@15.135.72.168 << EOF
            ls
            pwd
            cd fe
            pwd
            git pull origin main
            sudo docker build -t food_ordering_fe:latest .
            sudo docker run -dp 80:80 --name food_ordering_fe food_ordering_fe:latest
          EOF